global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'Flask-backend'
  
    static_configs:
      - targets: ['backend:5000'] 
  
  - job_name: 'postgres_exporter'

    static_configs:
      - targets: ['postgres_exporter:9187']

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093

rule_files:
  - "alert.rules.yml"